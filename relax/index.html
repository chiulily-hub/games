<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFlow — Beginner's Meditation & Mindfulness</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sage: { 50: '#f4f7f4', 100: '#e5ede5', 200: '#cbe0cb', 300: '#a3c7a3', 400: '#75a675', 500: '#528552', 600: '#3f683f', 700: '#335333', 800: '#2a432a', 900: '#233723' },
                        amber: { 50: '#fdfbf7', 100: '#f7f1e3', 200: '#eddcc3', 300: '#e0c29b', 400: '#d0a36e', 500: '#bc864b', 600: '#a7703e', 700: '#865633', 800: '#6c452c', 900: '#583825' }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Lora', serif; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.35); opacity: 0.95; }
        }
        .animate-breathe { animation: breathe 8s ease-in-out infinite; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 flex flex-col"
    x-data="meditationApp()" x-init="init()">

    <!-- Top Navigation -->
    <header class="sticky top-0 z-50 glass-panel border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-sage-500 text-white flex items-center justify-center shadow-md shadow-sage-500/20">
                <i class="fa-solid fa-spa text-lg"></i>
            </div>
            <div>
                <h1 class="font-serif font-bold text-lg tracking-tight text-slate-900 dark:text-white">MindFlow</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Beginner's Meditation & Mindfulness</p>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="hidden md:flex items-center space-x-1 bg-slate-200/60 dark:bg-slate-800/60 p-1 rounded-xl">
            <button @click="activeTab = 'library'" :class="activeTab === 'library' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all">Sessions</button>
            <button @click="activeTab = 'player'" :class="activeTab === 'player' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all">Player & Timer</button>
            <button @click="activeTab = 'videos'" :class="activeTab === 'videos' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all">Nature Videos</button>
            <button @click="activeTab = 'breathe'" :class="activeTab === 'breathe' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all">Breath Guide</button>
            <button @click="activeTab = 'journal'" :class="activeTab === 'journal' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all">Journal</button>
        </nav>

        <!-- Right Controls -->
        <div class="flex items-center space-x-3">
            <button @click="toggleMasterAudio()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-slate-700 dark:text-slate-300 relative" title="Toggle Ambient Audio">
                <i class="fa-solid" :class="audioPlaying ? 'fa-volume-high
